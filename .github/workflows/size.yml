name: Size

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Report compressed size changes
        uses: preactjs/compressed-size-action@v3
        with:
          install-script: npm ci
          build-script: npm run build
          compression: brotli
          pattern: "./dist/**/*.{html,css,js,json,webmanifest}"
          strip-hash: "[-.]([\\w-]{8}|[a-f0-9]{16})\\.[a-z]+$"
