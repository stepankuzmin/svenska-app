name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DEPLOY_MODE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check complexity
        run: npm run check:complexity
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check the constraints floor
        run: npm run check:floor
        env:
          CONSTRAINTS_BASE: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref || 'main') }}
      - name: Run unit tests with coverage
        run: npm run check:coverage
        env:
          CONSTRAINTS_BASE: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref || 'main') }}

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Generate dictionary and build application
        run: npm run build
      - name: Run built PWA journey
        run: npm run test:browser:release
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-traces
          path: test-results
          retention-days: 3
      - name: Build the Worker to deploy
        run: npx cf build --mode "$DEPLOY_MODE"
      - name: Validate dictionary release
        run: npm run release:check
      - name: Check size budgets
        run: npm run check:size
      - name: Validate Worker packaging
        run: npm run worker:check -- --mode "$DEPLOY_MODE"
      - name: Upload validated build
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: .cloudflare/output
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: [test, build]
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_OUTPUT_FILE_PATH: wrangler-output.ndjson
    environment:
      name: ${{ github.event_name == 'pull_request' && format('pr-preview-{0}', github.event.pull_request.number) || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install deployment dependencies
        run: npm ci
      - name: Download validated build
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: .cloudflare/output
      - name: Deploy the Worker
        id: deploy
        run: |
          npx cf deploy --prebuilt --mode "$DEPLOY_MODE"
          jq -r 'select(.type == "deploy") | "url=" + .targets[0], "name=" + .worker_name' \
            "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_OUTPUT"
      - name: Link the deployment
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: echo "[$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"
      - name: Install preview test browsers
        if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium webkit
      - name: Test deployed preview pairing and sync
        if: github.event_name == 'pull_request'
        env:
          SYNC_TEST_BASE_URL: ${{ steps.deploy.outputs.url }}
          WORKER_NAME: ${{ steps.deploy.outputs.name }}
        run: |
          test -n "$SYNC_TEST_BASE_URL"
          npx wrangler tail "$WORKER_NAME" --format pretty --search sync-request-failed > "$RUNNER_TEMP/sync-errors.log" 2>&1 &
          tail_pid=$!
          trap 'kill "$tail_pid" 2>/dev/null || true' EXIT
          tail_deadline=$((SECONDS + 30))
          until grep -q 'Connected to .*waiting for logs' "$RUNNER_TEMP/sync-errors.log"; do
            if ! kill -0 "$tail_pid" 2>/dev/null || [ "$SECONDS" -ge "$tail_deadline" ]; then
              cat "$RUNNER_TEMP/sync-errors.log"
              exit 1
            fi
            sleep 1
          done
          set +e
          npx playwright test tests/browser/library-sync.spec.ts --project=chromium --project=webkit
          test_status=$?
          if [ "$test_status" -ne 0 ]; then
            cat "$RUNNER_TEMP/sync-errors.log"
          fi
          exit "$test_status"
      - name: Upload deployed preview failure traces
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: preview-browser-failure-traces
          path: test-results
          retention-days: 3
