name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check complexity
        run: npm run check:complexity
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check the constraints floor
        run: npm run check:floor
        env:
          CONSTRAINTS_BASE: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref || 'main') }}
      - name: Run unit tests with coverage
        run: npm run check:coverage
        env:
          CONSTRAINTS_BASE: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref || 'main') }}

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Generate dictionary and build application
        run: npm run build
      - name: Validate dictionary release
        run: npm run release:check
      - name: Validate Worker packaging
        run: npm run worker:check
      - name: Check size budgets
        run: npm run check:size
      - name: Run built PWA journey
        run: npm run test:browser:release
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-traces
          path: test-results
          retention-days: 3
      - name: Upload validated site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 1

  deploy:
    needs: [test, build]
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_OUTPUT_FILE_PATH: wrangler-output.ndjson
    environment:
      name: ${{ github.event_name == 'pull_request' && format('pr-preview-{0}', github.event.pull_request.number) || 'production' }}
      url: ${{ steps.preview.outputs.url || steps.production.outputs.url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install deployment dependencies
        run: npm ci
      - name: Download validated site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - name: Deploy an isolated preview Worker
        if: github.event_name == 'pull_request'
        id: preview
        env:
          PREVIEW_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('wrangler.jsonc', 'utf8'));
          config.name += `-pr-${process.env.PREVIEW_NUMBER}`;
          config.ratelimits = config.ratelimits.map((binding) => ({
            ...binding,
            namespace_id: String(Number(binding.namespace_id) + Number(process.env.PREVIEW_NUMBER) * 10_000),
          }));
          config.preview_urls = false;
          writeFileSync('wrangler.preview.json', JSON.stringify(config));
          JS
          npx wrangler deploy --config wrangler.preview.json
          jq -r 'select(.type == "deploy") | "url=" + .targets[0]' \
            "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_OUTPUT"
      - name: Deploy to production
        if: github.event_name != 'pull_request'
        id: production
        run: |
          npx wrangler deploy
          jq -r 'select(.type == "deploy") | "url=" + .targets[0]' \
            "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_OUTPUT"
      - name: Link the deployment
        env:
          URL: ${{ steps.preview.outputs.url || steps.production.outputs.url }}
        run: echo "[$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"
      - name: Install preview test browsers
        if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium webkit
      - name: Test deployed preview pairing and sync
        if: github.event_name == 'pull_request'
        env:
          SYNC_TEST_BASE_URL: ${{ steps.preview.outputs.url }}
        run: |
          test -n "$SYNC_TEST_BASE_URL"
          npx playwright test tests/browser/library-sync.spec.ts --project=chromium --project=webkit
