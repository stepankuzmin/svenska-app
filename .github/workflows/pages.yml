name: GitHub Pages

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SITE_BASE_PATH: /${{ github.event.repository.name }}/
  PREVIEW_DIR: pr-preview/pr-${{ github.event.pull_request.number }}

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Run unit tests
        run: npm test
      - name: Generate dictionary and build application
        run: npm run build
      - name: Run mobile touch test in Vitest browsers
        run: npm run test:vitest:browser
      - name: Validate dictionary release
        run: npm run release:check
      - name: Run built PWA journey
        run: npm run test:browser:release
      - name: Rebuild for the pull request preview path
        if: github.event_name == 'pull_request'
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ env.SITE_BASE_PATH }}${{ env.PREVIEW_DIR }}/
      - name: Upload validated site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 1

  publish:
    needs: build
    if: >-
      github.event.action != 'closed' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    environment:
      name: ${{ github.event_name == 'pull_request' && format('pr-preview-{0}', github.event.pull_request.number) || 'production' }}
      url: ${{ steps.publish.outputs.url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/publish-pages.sh
          sparse-checkout-cone-mode: false
      - name: Download validated site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - name: Publish to the gh-pages branch
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DESTINATION: ${{ github.event_name == 'pull_request' && env.PREVIEW_DIR || '.' }}
        run: |
          scripts/publish-pages.sh "$DESTINATION" dist
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io${SITE_BASE_PATH}"
          if [ "$DESTINATION" != "." ]; then
            url="${url}${DESTINATION}/"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "[$url]($url)" >> "$GITHUB_STEP_SUMMARY"

  remove-preview:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/publish-pages.sh
          sparse-checkout-cone-mode: false
      - name: Delete the preview directory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/publish-pages.sh "$PREVIEW_DIR"
      - name: Deactivate the preview deployments
        uses: actions/github-script@v9
        with:
          script: |
            const environment = `pr-preview-${context.payload.pull_request.number}`;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              ...context.repo,
              environment,
            });
            for (const deployment of deployments) {
              await github.rest.repos.createDeploymentStatus({
                ...context.repo,
                deployment_id: deployment.id,
                state: "inactive",
              });
            }
