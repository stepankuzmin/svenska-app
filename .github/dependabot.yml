version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
    cooldown:
      default-days: 1
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
    cooldown:
      default-days: 1
    groups:
      github-actions:
        patterns: ["*"]
