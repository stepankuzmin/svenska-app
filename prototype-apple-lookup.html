<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROTOTYPE: Apple-informed lookup</title>
  <style>
    * { box-sizing:border-box } body { margin:0; background:#e9ebe5; font:100%/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#17211a } button,input { font:inherit } button { cursor:pointer } #stage { min-height:100dvh }
    .screen { min-height:100dvh; padding:18px 18px 110px; overflow:hidden } .frame { max-width:680px; margin:auto } .top { display:flex; align-items:center; justify-content:space-between; margin-bottom:22px } .wordmark { font-size:1.12rem; font-weight:720; letter-spacing:-.035em } .wordmark span { color:#4c7a45 } .library { border:0; background:transparent; color:inherit; font-weight:590; padding:8px 0 } .search { display:flex; align-items:center; gap:8px; border:1px solid #d1d8ce; border-radius:15px; background:#fff; padding:7px 7px 7px 13px } .search input { flex:1; min-width:0; border:0; outline:0; background:transparent; color:inherit } .search button,.action { border:0; border-radius:10px; padding:9px 14px; background:#24623a; color:#fff; font-weight:650 } .meta { margin-top:38px; color:#657467; font-size:.73rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase } h1 { margin:7px 0 2px; font-size:clamp(4rem,15vw,6.5rem); font-weight:700; letter-spacing:-.075em; line-height:.88; font-optical-sizing:auto } .pronunciation { color:#728074; font-size:.92rem } .translation { margin-top:31px; font-size:clamp(1.5rem,5vw,2.2rem); font-weight:650; letter-spacing:-.03em; line-height:1.15 } .note { max-width:43ch; margin:12px 0 0; color:#526055 } .recent { margin-top:35px; padding-top:15px; border-top:1px solid #d4d9d1 } .recent-title { display:flex; justify-content:space-between; color:#718074; font-size:.73rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase } .entry { display:flex; align-items:center; justify-content:space-between; width:100%; border:0; border-bottom:1px solid #e0e4de; background:transparent; padding:13px 1px; color:inherit; text-align:left } .entry strong,.entry small { display:block } .entry small { color:#69776b } .entry b { color:#83a67b; font-size:1.35rem; font-weight:400 }
    .quiet { background:linear-gradient(155deg,#fbfaf5 0%,#eef4e9 100%) } .quiet .top { position:sticky; top:0; z-index:1; padding:4px 0 12px; background:linear-gradient(#fbfaf5e8,#fbfaf500); backdrop-filter:blur(14px) saturate(1.2) } .quiet .search:focus-within { box-shadow:0 0 0 4px #7ebc7040; transition:box-shadow 150ms ease-out } .quiet .translation { color:#1f5732 }
    .focus { background:#10241a; color:#eff5eb } .focus .top { margin-bottom:38px } .focus .search { border-color:#345b43; background:#183328 } .focus .search input { color:#fff } .focus .search button { background:#d9f66c; color:#17311f } .focus .meta,.focus .pronunciation,.focus .note,.focus .recent-title,.focus .entry small { color:#aabbaa } .focus .translation { color:#d9f66c } .focus .recent { border-color:#385943 } .focus .entry { border-color:#2d4a38 } .focus .entry b { color:#d9f66c } .focus .library { color:#d9f66c }
    .reference { background:#f0f1ed; color:#101a13 } .reference .frame { max-width:900px } .reference .top { padding-bottom:14px; border-bottom:1px solid #bbc4bb } .reference .wordmark { font-family:ui-serif,Georgia,serif; font-size:1.35rem } .reference .search { border-radius:5px; border:2px solid #17251a; box-shadow:4px 4px 0 #c8d3c8 } .reference .search button { border-radius:3px; background:#145941 } .reference .result-card { margin-top:24px; border:1px solid #cbd3c8; border-radius:4px 22px 22px 22px; background:#fffefa; box-shadow:0 10px 27px #1b2d181c; padding:26px } .reference .meta { margin-top:0; color:#206448 } .reference .translation { color:#145941 } .reference .recent { margin-top:0; padding:22px 26px; border:1px solid #cbd3c8; border-top:0; border-radius:0 0 22px 22px; background:#fffefa }
    .sheet-backdrop { position:fixed; inset:0; z-index:5; display:grid; align-items:end; background:#10201552; opacity:0; pointer-events:none; transition:opacity 180ms ease-out } .sheet-backdrop[data-open] { opacity:1; pointer-events:auto } .sheet { width:min(100%,720px); margin:auto; border-radius:24px 24px 0 0; background:#f8faf5eF; color:#17211a; box-shadow:0 -12px 40px #0003; transform:translateY(105%); transition:transform 220ms cubic-bezier(.23,1,.32,1); backdrop-filter:blur(22px) saturate(1.3); padding:10px 20px 34px } .sheet-backdrop[data-open] .sheet { transform:translateY(0) } .grab { width:38px; height:5px; margin:0 auto 15px; border-radius:999px; background:#9aa59b } .sheet-head { display:flex; justify-content:space-between; align-items:center } .sheet-head h2 { margin:0; font-size:1.1rem; letter-spacing:-.02em } .close { border:0; border-radius:50%; width:31px; height:31px; background:#e0e6df; color:#26412c; font-size:1.1rem } .library-list { margin-top:12px } .library-list .entry:last-child { border-bottom:0 }
    @media (prefers-reduced-motion:reduce) { .sheet-backdrop,.sheet { transition:opacity 160ms ease } .sheet { transform:none; opacity:0 } .sheet-backdrop[data-open] .sheet { opacity:1 } } @media (prefers-reduced-transparency:reduce) { .sheet { background:#f8faf5; backdrop-filter:none } } @media (prefers-contrast:more) { .search,.result-card { border-color:currentColor!important } .entry { border-color:currentColor!important } }
    .proto-picker { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:2147483647; display:flex; align-items:center; gap:2px; padding:4px; border-radius:999px; background:rgba(10,10,10,.82); -webkit-backdrop-filter:blur(12px) saturate(1.4); backdrop-filter:blur(12px) saturate(1.4); box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:13px; line-height:1; -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none }
    .proto-picker-highlight { position:absolute; top:4px; left:0; height:28px; border-radius:999px; background:rgba(255,255,255,.12); will-change:transform } .proto-picker[data-ready] .proto-picker-highlight { transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1) } @media (prefers-reduced-motion:reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition:none } } .proto-picker-item { position:relative; display:flex; align-items:center; height:28px; padding:0 12px; border:0; border-radius:999px; background:transparent; color:rgba(255,255,255,.55); font:inherit; cursor:pointer; transition:color 150ms ease-out } .proto-picker-item:hover { color:rgba(255,255,255,.85) } .proto-picker-item:active { transform:scale(.97) } .proto-picker-item:focus-visible { outline:2px solid rgba(255,255,255,.4); outline-offset:2px } .proto-picker-item[data-active] { color:#fff } .proto-picker-divider { width:1px; height:16px; margin:0 4px; background:rgba(255,255,255,.12) } .proto-picker-replay { padding:0 10px; font-size:14px } .proto-picker[data-position="top"] { bottom:auto; top:24px }
  </style>
</head>
<body>
  <div id="stage"></div>
  <nav class="proto-picker" data-position="top" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Quiet Reading</button>
    <button class="proto-picker-item">Focus Mode</button>
    <button class="proto-picker-item">Reference Desk</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>
  <script>
    const rows = [["smörgås","бутерброд"],["tack","спасибо"],["lagom","в меру"]];
    const entries = rows.map(([word,translation]) => `<button class="entry" data-open="${word}"><span><strong>${word}</strong><small>${translation}</small></span><b>›</b></button>`).join("");
    const chrome = (kind, content) => `<div class="screen ${kind}"><div class="frame"><header class="top"><div class="wordmark">svenska<span>.</span></div><button class="library" data-library>Library · 3</button></header><form class="search" data-search><span aria-hidden="true">⌕</span><input aria-label="Search Swedish or Russian" value="fika"><button>Search</button></form>${content}</div></div>`;
    const lookup = (wrap="") => `<${wrap||"article"} class="${wrap?"result-card":""}"><div class="meta">Swedish · noun</div><h1>fika</h1><div class="pronunciation">/ˈfiːka/</div><div class="translation">перерыв на кофе</div><p class="note">Coffee and something sweet, usually shared with someone.</p></${wrap||"article"}><section class="recent"><div class="recent-title"><span>Recent lookups</span><span>3 words</span></div>${entries}</section>`;
    const sheet = `<div class="sheet-backdrop" id="sheet"><section class="sheet" aria-label="Library"><div class="grab"></div><header class="sheet-head"><h2>Library</h2><button class="close" data-close aria-label="Close library">×</button></header><div class="library-list">${entries}</div></section></div>`;
    const variants = [
      () => chrome("quiet",lookup()+sheet),
      () => chrome("focus",lookup()+sheet),
      () => chrome("reference",lookup("div")+sheet)
    ];
    const stage = document.getElementById("stage");
    const picker = document.querySelector(".proto-picker");
    const highlight = picker.querySelector(".proto-picker-highlight");
    const items = [...picker.querySelectorAll(".proto-picker-item:not(.proto-picker-replay)")];
    const replay = picker.querySelector(".proto-picker-replay");
    let current = 0;
    function moveHighlight() { const el=items[current]; highlight.style.width=el.offsetWidth+"px"; highlight.style.transform=`translateX(${el.offsetLeft}px)`; }
    function bindStage() { stage.querySelector("[data-library]").onclick=()=>stage.querySelector("#sheet").setAttribute("data-open",""); stage.querySelector("[data-close]").onclick=()=>stage.querySelector("#sheet").removeAttribute("data-open"); stage.querySelector("#sheet").onclick=e=>{if(e.target.id==="sheet") e.currentTarget.removeAttribute("data-open")}; stage.querySelector("[data-search]").onsubmit=e=>{e.preventDefault(); const input=e.currentTarget.querySelector("input"); input.value="fika"; input.focus()}; stage.querySelectorAll("[data-open]").forEach(button=>button.onclick=()=>{stage.querySelector("#sheet").removeAttribute("data-open"); stage.querySelector("h1").textContent=button.dataset.open}); }
    function mount(i) { stage.innerHTML=""; requestAnimationFrame(()=>{stage.innerHTML=variants[i]();bindStage()}) }
    function setActive(i) { if(i<0||i>=variants.length)return; current=i; items.forEach((el,j)=>{el.toggleAttribute("data-active",j===i);if(j===i)el.setAttribute("aria-current","true");else el.removeAttribute("aria-current")});moveHighlight();const url=new URL(location);url.searchParams.set("v",i+1);history.replaceState(null,"",url);mount(i) }
    items.forEach((el,i)=>el.addEventListener("click",()=>setActive(i)));replay?.addEventListener("click",()=>mount(current));window.addEventListener("resize",moveHighlight);
    document.addEventListener("keydown",e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.metaKey||e.ctrlKey||e.altKey)return;const num=parseInt(e.key,10);if(num>=1&&num<=variants.length)setActive(num-1);else if(e.key==="ArrowRight")setActive((current+1)%variants.length);else if(e.key==="ArrowLeft")setActive((current-1+variants.length)%variants.length);else if(e.key==="r"||e.key==="R")mount(current)});
    setActive((parseInt(new URLSearchParams(location.search).get("v"),10)||1)-1);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute("data-ready","")));
  </script>
</body>
</html>
