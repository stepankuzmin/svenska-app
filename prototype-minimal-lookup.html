<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROTOTYPE: minimal lookup</title>
  <style>
    @import url("https://rsms.me/inter/inter.css");
    * { box-sizing:border-box } body { margin:0; color:#181818; background:#fff; font:100%/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-synthesis:none; -webkit-font-smoothing:antialiased } button,input { font:inherit } button { cursor:pointer } #stage { min-height:100dvh }
    .screen { min-height:100dvh; padding:24px 20px 110px } .frame { width:min(100%,640px); margin:auto } .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:38px } .brand { font-size:.95rem; font-weight:600; letter-spacing:-.02em } .library { border:0; background:transparent; color:#555; font-size:.9rem; padding:0 }
    .search { display:flex; align-items:center; border:1px solid #dedede; border-radius:12px; padding:5px 5px 5px 13px } .search:focus-within { border-color:#777 } .search input { flex:1; min-width:0; border:0; outline:0; color:inherit; background:transparent } .search button { border:0; border-radius:8px; padding:8px 13px; background:#191919; color:#fff; font-weight:600 }
    .kind { margin-top:46px; color:#777; font-size:.76rem; letter-spacing:.06em; text-transform:uppercase } h1 { margin:9px 0 2px; font-size:clamp(4rem,15vw,6.7rem); line-height:.86; letter-spacing:-.08em; font-weight:680 } .pronunciation { color:#777; font-size:.9rem } .translation { margin-top:30px; font-size:clamp(1.5rem,5vw,2.05rem); line-height:1.16; letter-spacing:-.035em; font-weight:580 } .note { max-width:42ch; margin:12px 0 0; color:#666 } .recent { margin-top:46px; border-top:1px solid #e5e5e5; padding-top:14px } .section-label { color:#777; font-size:.75rem; letter-spacing:.06em; text-transform:uppercase } .row { display:flex; justify-content:space-between; align-items:center; width:100%; border:0; border-bottom:1px solid #ededed; background:transparent; color:inherit; padding:13px 0; text-align:left } .row strong,.row small { display:block } .row small { color:#777 } .row b { color:#999; font-size:1.2rem; font-weight:400 }
    .paper { background:#faf9f6 } .paper h1 { font-weight:680; letter-spacing:-.075em; line-height:.9 } .paper .translation { font-weight:620; letter-spacing:-.02em; line-height:1.26 } .paper .note { line-height:1.58 } .paper .search button { background:#2b2a27 }
    .plain { background:#fff } .plain .top { margin-bottom:26px } .plain .brand { text-transform:lowercase } .plain .search { border-radius:0; border-width:0 0 1px; padding:8px 0 } .plain .search button { border-radius:0; background:transparent; color:#181818; padding-right:0 } .plain .kind { margin-top:54px } .plain .recent { border-top:0; padding-top:0 }
    .index { background:#f3f3f3 } .index .frame { max-width:760px } .index .top { margin-bottom:28px } .index .search { background:#fff; border-color:#fff; border-radius:999px; box-shadow:0 1px 2px #00000010 } .index .result { background:#fff; margin-top:24px; padding:28px; border-radius:2px } .index .kind { margin-top:0 } .index .recent { margin-top:0; padding:20px 28px; border:0; background:#fff; border-top:1px solid #eee }
    .library-panel { display:none; margin-top:24px; border-top:1px solid #ddd; padding-top:14px } .library-panel[data-open] { display:block } .library-panel h2 { margin:0 0 7px; font-size:.8rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:#777 }
    .proto-picker { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:2147483647; display:flex; align-items:center; gap:2px; padding:4px; border-radius:999px; background:rgba(10, 10, 10, 0.82); -webkit-backdrop-filter:blur(12px) saturate(1.4); backdrop-filter:blur(12px) saturate(1.4); box-shadow:0 0 0 1px rgba(255, 255, 255, 0.08) inset,0 8px 24px rgba(0, 0, 0, 0.24),0 2px 6px rgba(0, 0, 0, 0.12); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:13px; line-height:1; -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none }
    .proto-picker-highlight { position:absolute; top:4px; left:0; height:28px; border-radius:999px; background:rgba(255,255,255,.12); will-change:transform }.proto-picker[data-ready] .proto-picker-highlight { transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1) }@media(prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}.proto-picker-item:hover{color:rgba(255,255,255,.85)}.proto-picker-item:active{transform:scale(.97)}.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}.proto-picker-item[data-active]{color:#fff}.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}.proto-picker-replay{padding:0 10px;font-size:14px}
  </style>
</head>
<body>
  <div id="stage"></div>
  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Paper</button>
    <button class="proto-picker-item">Plain</button>
    <button class="proto-picker-item">Index</button>
  </nav>
  <script>
    const rows=[["smörgås","бутерброд"],["tack","спасибо"],["lagom","в меру"]];
    const list=rows=>rows.map(([word,translation])=>`<button class="row" data-word="${word}"><span><strong>${word}</strong><small>${translation}</small></span><b>›</b></button>`).join("");
    const content=wrap=>`<${wrap} class="${wrap==="article"?"":"result"}"><div class="kind">Swedish · noun</div><h1>fika</h1><div class="pronunciation">/ˈfiːka/</div><div class="translation">перерыв на кофе</div><p class="note">Coffee and something sweet, usually shared with someone.</p></${wrap}><section class="recent"><div class="section-label">Recent lookups</div>${list(rows)}</section>`;
    const render=(klass,wrap)=>`<main class="screen ${klass}"><div class="frame"><header class="top"><div class="brand">svenska</div><button class="library" data-library>Library</button></header><form class="search" data-search><input aria-label="Search Swedish or Russian" value="fika"><button>Search</button></form>${content(wrap)}<aside class="library-panel" data-panel><h2>Library</h2>${list(rows)}</aside></div></main>`;
    const variants=[()=>render("paper","article"),()=>render("plain","article"),()=>render("index","div")];
    const stage=document.getElementById("stage"),picker=document.querySelector(".proto-picker"),highlight=picker.querySelector(".proto-picker-highlight"),items=[...picker.querySelectorAll(".proto-picker-item")];let current=0;
    function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+"px";highlight.style.transform=`translateX(${el.offsetLeft}px)`}
    function bind(){stage.querySelector("[data-library]").onclick=()=>stage.querySelector("[data-panel]").toggleAttribute("data-open");stage.querySelector("[data-search]").onsubmit=e=>{e.preventDefault();stage.querySelector("h1").textContent=stage.querySelector("input").value||"fika"};stage.querySelectorAll("[data-word]").forEach(b=>b.onclick=()=>{stage.querySelector("h1").textContent=b.dataset.word;stage.querySelector("[data-panel]").removeAttribute("data-open")})}
    function mount(i){stage.innerHTML="";requestAnimationFrame(()=>{stage.innerHTML=variants[i]();bind()})}
    function setActive(i){if(i<0||i>=variants.length)return;current=i;items.forEach((el,j)=>{el.toggleAttribute("data-active",j===i);if(j===i)el.setAttribute("aria-current","true");else el.removeAttribute("aria-current")});moveHighlight();const url=new URL(location);url.searchParams.set("v",i+1);history.replaceState(null,"",url);mount(i)}
    items.forEach((el,i)=>el.addEventListener("click",()=>setActive(i)));window.addEventListener("resize",moveHighlight);document.addEventListener("keydown",e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable||e.metaKey||e.ctrlKey||e.altKey)return;const num=parseInt(e.key,10);if(num>=1&&num<=variants.length)setActive(num-1);else if(e.key==="ArrowRight")setActive((current+1)%variants.length);else if(e.key==="ArrowLeft")setActive((current-1+variants.length)%variants.length)});setActive((parseInt(new URLSearchParams(location.search).get("v"),10)||1)-1);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute("data-ready","")));
  </script>
</body>
</html>
