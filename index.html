<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f1ef" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1c1e" />
    <meta name="color-scheme" content="light dark" />
    <title>Svenska.app</title>
    <script>
      if ("serviceWorker" in navigator) {
        let hasController = navigator.serviceWorker.controller !== null;
        let isReloading = false;

        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (!hasController) {
            hasController = true;
            return;
          }

          if (!isReloading) {
            isReloading = true;
            window.location.reload();
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
